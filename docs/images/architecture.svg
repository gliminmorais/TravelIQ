<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000" role="img" aria-labelledby="title description">
<title id="title">TravelIQ public version architecture</title><desc id="description">GitHub source is deployed through Vercel. Within each visitor's browser, PDF.js and ticket parsers extract a local ticket. Human review and Zod validation feed React workspace state. Browser localStorage persists bookings, and remaining records drive financials, charts, customer insights, forecasts and CSV downloads. Delete removes a record, and Reset saves an empty dataset. PDFs are not uploaded or retained.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8998b6" stroke-width="1.5"/></marker><marker id="back" markerWidth="9" markerHeight="9" refX="0" refY="4" orient="auto"><path d="M8 0 L0 4 L8 8" fill="none" stroke="#8998b6" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="1000" fill="#f5f7fc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="60" y="65" font-size="38" fill="#17253f" font-weight="750">TravelIQ</text><text x="242" y="64" font-size="18" fill="#65738c" font-weight="600">PUBLIC VERSION ARCHITECTURE</text>
<text x="60" y="96" font-size="20" fill="#526179" font-weight="400">A hosted interface. A separate workspace in each visitor’s browser.</text>
<rect x="60" y="135" width="290" height="125" rx="16" fill="white" stroke="#dce3ef"/><rect x="78" y="155" width="5" height="24" rx="2" fill="#5867dc"/><text x="95" y="174" font-size="20" fill="#17253f" font-weight="700">GitHub</text><text x="80" y="205" font-size="16" fill="#526179" font-weight="400">Public source repository</text><text x="80" y="230" font-size="16" fill="#526179" font-weight="400">Commit and push</text>
<rect x="465" y="135" width="330" height="125" rx="16" fill="white" stroke="#dce3ef"/><rect x="483" y="155" width="5" height="24" rx="2" fill="#5867dc"/><text x="500" y="174" font-size="20" fill="#17253f" font-weight="700">Vercel / Next.js</text><text x="485" y="205" font-size="16" fill="#526179" font-weight="400">Build and serve the interface</text><text x="485" y="230" font-size="16" fill="#526179" font-weight="400">JavaScript + local PDF worker</text>
<rect x="910" y="135" width="310" height="125" rx="16" fill="white" stroke="#dce3ef"/><rect x="928" y="155" width="5" height="24" rx="2" fill="#229c89"/><text x="945" y="174" font-size="20" fill="#17253f" font-weight="700">Visitor opens TravelIQ</text><text x="930" y="205" font-size="16" fill="#526179" font-weight="400">App loads into the browser</text><text x="930" y="230" font-size="16" fill="#526179" font-weight="400">Bookings stay on this device</text>
<path d="M355 195 H455" fill="none" stroke="#8998b6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M800 195 H900" fill="none" stroke="#8998b6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" />
<rect x="40" y="310" width="1200" height="625" rx="24" fill="#edf2fc" stroke="#cfdaee" stroke-width="2"/>
<text x="70" y="353" font-size="19" fill="#40568d" font-weight="700">EACH VISITOR’S BROWSER</text>
<text x="818" y="353" font-size="17" fill="#40568d" font-weight="400">React · local processing · local storage</text>
<rect x="70" y="390" width="190" height="145" rx="16" fill="white" stroke="#dce3ef"/><rect x="88" y="410" width="5" height="24" rx="2" fill="#229c89"/><text x="105" y="429" font-size="20" fill="#17253f" font-weight="700">Ticket PDF</text><text x="90" y="460" font-size="16" fill="#526179" font-weight="400">Select a local file</text><text x="90" y="485" font-size="16" fill="#526179" font-weight="400">4 MB / 20 pages</text><text x="90" y="510" font-size="16" fill="#526179" font-weight="400">No file upload</text>
<rect x="300" y="390" width="230" height="145" rx="16" fill="white" stroke="#dce3ef"/><rect x="318" y="410" width="5" height="24" rx="2" fill="#229c89"/><text x="335" y="429" font-size="20" fill="#17253f" font-weight="700">Extract + preview</text><text x="320" y="460" font-size="16" fill="#526179" font-weight="400">PDF.js worker</text><text x="320" y="485" font-size="16" fill="#526179" font-weight="400">Ticket layout adapters</text><text x="320" y="510" font-size="16" fill="#526179" font-weight="400">Original PDF on canvas</text>
<rect x="570" y="390" width="270" height="145" rx="16" fill="white" stroke="#dce3ef"/><rect x="588" y="410" width="5" height="24" rx="2" fill="#229c89"/><text x="605" y="429" font-size="20" fill="#17253f" font-weight="700">Review + validate</text><text x="590" y="460" font-size="16" fill="#526179" font-weight="400">Confirm ticket details</text><text x="590" y="485" font-size="16" fill="#526179" font-weight="400">Enter cost + charge</text><text x="590" y="510" font-size="16" fill="#526179" font-weight="400">Zod checks before save</text>
<rect x="880" y="390" width="330" height="145" rx="16" fill="white" stroke="#dce3ef"/><rect x="898" y="410" width="5" height="24" rx="2" fill="#5867dc"/><text x="915" y="429" font-size="20" fill="#17253f" font-weight="700">Workspace state</text><text x="900" y="460" font-size="16" fill="#526179" font-weight="400">Bookings + financial entries</text><text x="900" y="485" font-size="16" fill="#526179" font-weight="400">Create · edit · delete · reset</text><text x="900" y="510" font-size="16" fill="#526179" font-weight="400">Manual booking entry too</text>
<path d="M265 461 H290" fill="none" stroke="#8998b6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M535 461 H560" fill="none" stroke="#8998b6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M845 461 H870" fill="none" stroke="#8998b6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" />
<rect x="70" y="635" width="450" height="155" rx="16" fill="white" stroke="#dce3ef"/><rect x="88" y="655" width="5" height="24" rx="2" fill="#5867dc"/><text x="105" y="674" font-size="20" fill="#17253f" font-weight="700">Reports + intelligence</text><text x="90" y="705" font-size="16" fill="#526179" font-weight="400">Decimal.js financial calculations</text><text x="90" y="730" font-size="16" fill="#526179" font-weight="400">Charts · customers · anomaly rules</text><text x="90" y="755" font-size="16" fill="#526179" font-weight="400">Evaluated forecast baselines</text>
<rect x="565" y="635" width="235" height="155" rx="16" fill="white" stroke="#dce3ef"/><rect x="583" y="655" width="5" height="24" rx="2" fill="#5867dc"/><text x="600" y="674" font-size="20" fill="#17253f" font-weight="700">CSV downloads</text><text x="585" y="705" font-size="16" fill="#526179" font-weight="400">Filtered booking data</text><text x="585" y="730" font-size="16" fill="#526179" font-weight="400">Financial summaries</text><text x="585" y="755" font-size="16" fill="#526179" font-weight="400">Saved to your device</text>
<rect x="880" y="635" width="330" height="155" rx="16" fill="white" stroke="#dce3ef"/><rect x="898" y="655" width="5" height="24" rx="2" fill="#229c89"/><text x="915" y="674" font-size="20" fill="#17253f" font-weight="700">Browser localStorage</text><text x="900" y="705" font-size="16" fill="#526179" font-weight="400">Save and reload booking data</text><text x="900" y="730" font-size="16" fill="#526179" font-weight="400">Storage events sync open tabs</text><text x="900" y="755" font-size="16" fill="#526179" font-weight="400">Other profiles stay separate</text>
<path d="M990 541 V572 H295 V625" fill="none" stroke="#8998b6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="395" y="596" font-size="16" fill="#526179" font-weight="400">Remaining records drive every report</text>
<path d="M1045 547 V623" fill="none" stroke="#8998b6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#back)"/><text x="1063" y="590" font-size="16" fill="#526179" font-weight="400">save / load</text>
<path d="M525 711 H555" fill="none" stroke="#8998b6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" />
<rect x="70" y="825" width="1140" height="74" rx="13" fill="#ffffff"/>
<text x="92" y="855" font-size="15" fill="#40568d" font-weight="700">DELETE</text><text x="173" y="855" font-size="17" fill="#526179" font-weight="400">Removes the booking and its related entries from saved data and reports.</text>
<text x="92" y="881" font-size="15" fill="#40568d" font-weight="700">RESET</text><text x="173" y="881" font-size="17" fill="#526179" font-weight="400">Saves an empty dataset; the workspace stays empty after refresh.</text>
<text x="60" y="970" font-size="17" fill="#526179" font-weight="400">PDFs are temporary. Email stays blank by default. Sample data appears only before a visitor resets.</text>
</g></svg>